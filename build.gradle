plugins {
    id 'java'
    id 'com.github.johnrengelman.shadow' version '8.1.1'
}

group = 'com.itzitzo'
version = '0.1.0'

repositories {
    mavenCentral()
}

java {
    toolchain {
        languageVersion = JavaLanguageVersion.of(17)
    }
}

dependencies {
    implementation 'com.amazonaws:aws-lambda-java-core:1.2.3'
    implementation 'com.amazonaws:aws-lambda-java-events:3.11.5'

    implementation platform('software.amazon.awssdk:bom:2.30.13')
    implementation 'software.amazon.awssdk:bedrockruntime'
    implementation 'software.amazon.awssdk:dynamodb'
    implementation 'software.amazon.awssdk:s3'

    implementation 'com.fasterxml.jackson.core:jackson-databind:2.18.3'
    implementation 'org.eclipse.angus:jakarta.mail:2.0.3'
    implementation 'org.jsoup:jsoup:1.18.3'

    implementation 'org.slf4j:slf4j-api:2.0.16'
    runtimeOnly 'org.slf4j:slf4j-simple:2.0.16'

    testImplementation 'org.junit.jupiter:junit-jupiter:5.11.3'
    testImplementation 'org.mockito:mockito-core:5.15.2'
}

tasks.test {
    useJUnitPlatform {
        excludeTags 'bedrock-eval'
    }
}

tasks.register('bedrockEval', Test) {
    description = 'Score the bedrock-evals fixtures against a live Nova model.'
    group = 'verification'
    testClassesDirs = sourceSets.test.output.classesDirs
    classpath = sourceSets.test.runtimeClasspath
    useJUnitPlatform {
        includeTags 'bedrock-eval'
    }
    systemProperty 'BEDROCK_MODEL_ID', System.getenv('BEDROCK_MODEL_ID') ?: 'eu.amazon.nova-micro-v1:0'
    systemProperty 'AWS_REGION', System.getenv('AWS_REGION') ?: 'eu-west-1'
    shouldRunAfter tasks.test
}

tasks.shadowJar {
    archiveClassifier.set('')
    mergeServiceFiles()
}

tasks.jar {
    enabled = false
}

tasks.register('lambdaZip', Zip) {
    dependsOn tasks.shadowJar
    archiveFileName = 'lambda.zip'
    destinationDirectory = layout.buildDirectory.dir('deploy')
    from(tasks.shadowJar.archiveFile) {
        into 'lib'
        rename { 'app.jar' }
    }
}
